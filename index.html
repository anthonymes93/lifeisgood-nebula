<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Is Good — Deployment Test</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#203554,#0b1020 65%);color:#f4f7ff}
    main{width:min(540px,calc(100% - 32px));padding:48px 38px;border:1px solid #52658166;border-radius:24px;background:#ffffff0c;box-shadow:0 24px 90px #0005;text-align:center}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 20px #4ade8099;margin-right:8px}
    .status{color:#c5f6d7;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(2.2rem,7vw,3.5rem);letter-spacing:-.05em;margin:22px 0 12px}
    p{color:#c3cddd;line-height:1.65}
    code{color:#b6d8ff}
    small{color:#93a4bc}
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>HTML file ready</div>
    <h1>Life Is Good.</h1>
    <p>This is a simple static page for testing deployment from <strong>GitHub</strong> to <strong>Namecheap Nebula</strong>.</p>
    <p><code>index.html</code></p>
    <small>Uploading this file to GitHub alone does not deploy it to your hosting account.</small>
  </main>
</body>
</html>
